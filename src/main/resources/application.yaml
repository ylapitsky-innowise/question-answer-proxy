# src/main/resources/application.yaml

# ============================================
# Основные настройки приложения
# ============================================
spring:
  application:
    name: question-answer-proxy
  cache:
    type: caffeine
    caffeine:
      # maximumSize — потолок числа закэшированных списков (у вас их немного).
      # expireAfterWrite — TTL: через 15 минут при следующем запросе
      # произойдёт ленивая синхронизация с Google Sheets.
      spec: maximumSize=20,expireAfterWrite=15m

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 2
  compression:
    # Gzip: превращает тяжёлые JSON-ответы в ~1/5 от исходного размера.
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/plain,text/csv


# ============================================
# Sources Configuration (внешний конфиг)
# ============================================
sources:
  config-path: ${SOURCES_CONFIG_PATH:./config/sources.yaml}    # ← путь к реальному конфигу (НЕ в репозитории)
  config-example-path: ${SOURCES_EXAMPLE_PATH:./config/sources.example.yaml}  # ← путь к примеру (в репозитории)


# ============================================
# Google Sheets Configuration
# ============================================
google:
  sheets:
    application-name: "Question Proxy"
    spreadsheet-id: ${SPREADSHEET_ID:1VAvwTtTPFTqLSIhxgyK-s3Hz6ZHt73JIJJTC3xTWgsI}
    range: ${RANGE:question_answer}
    metadata-range: ${METADATA_RANGE:metadata!A2:B4}
  credentials:
    json: ${GOOGLE_CREDENTIALS}


# ============================================
# Cache Configuration
# ============================================
cache:
  version-check-interval: 60000  # 1 минута в миллисекундах
  ttl-hours: 24                   # Время жизни кэша в часах


# ============================================
# Logging
# ============================================
logging:
  level:
    com.innowise.qaproxy: DEBUG
    com.google.api: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"


# ============================================
# Management / Actuator (опционально)
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
#      show-details: when-authorized
